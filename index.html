<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADE AGS</title>
  <script>
    // Prevenir flash de contenido sin estilo (FOUC). Va inline y en <head> a propósito:
    // tiene que correr ANTES de que se pinte nada, así que no puede ser un módulo.
    // El default es "dark" y se persiste aquí mismo — si difiriera del default que aplica
    // el bundle al arrancar, la primera carga mostraría el tema equivocado durante un
    // frame, que es justo lo que este script existe para evitar.
    const theme = localStorage.getItem('theme') || 'dark';
    localStorage.setItem('theme', theme);
    document.documentElement.classList.toggle('dark', theme === 'dark');
  </script>
  <style>
    /* A tela de carregamento: o robô do ADE AGS enquanto o app abre. Mora aqui, e não no bundle,
       para ser a PRIMEIRA coisa que a janela pinta; `src/app/splash.ts` avança as etapas e a tira.
       As cores repetem as do mascote (`--mascot-*` em App.css), que ainda não carregou. */
    #ags-splash {
      --sp-bg: #f5f5f7; --sp-fg: #1c1c1e; --sp-muted: #5b5b60; --sp-todo: #8a8a90; --sp-track: #dcdce0;
      --sp-body: #52525b; --sp-shade: #27272a; --sp-visor: #111113; --sp-glow: #e0a032;
      --sp-halo: rgba(224, 160, 50, 0.2); --sp-shadow: rgba(0, 0, 0, 0.14);
      position: fixed; inset: 0; z-index: 2147483000; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 26px; padding-bottom: 36px;
      background: var(--sp-bg); color: var(--sp-fg);
      font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, -apple-system, sans-serif;
      transition: opacity .3s ease; user-select: none; cursor: default;
    }
    html.dark #ags-splash {
      --sp-bg: #151517; --sp-fg: #ececee; --sp-muted: #9a9aa0; --sp-todo: #6e6e74; --sp-track: #2a2a2e;
      --sp-body: #e4e4e7; --sp-shade: #a1a1aa; --sp-visor: #0f0f11; --sp-glow: #f0b955;
      --sp-halo: rgba(240, 185, 85, 0.22); --sp-shadow: rgba(0, 0, 0, 0.55);
    }
    #ags-splash.is-leaving { opacity: 0; pointer-events: none; }
    #ags-splash .sp-stage { position: relative; width: 210px; height: 210px; display: grid; place-items: center; }
    #ags-splash .sp-halo { position: absolute; inset: 6px; border-radius: 50%; background: radial-gradient(closest-side, var(--sp-halo), transparent); animation: sp-halo 2.4s ease-in-out infinite; }
    #ags-splash svg.sp-bot { position: relative; width: 168px; height: 168px; }
    #ags-splash .sp-word { display: flex; align-items: baseline; gap: 8px; font-size: 30px; }
    #ags-splash .sp-word b { font-weight: 700; letter-spacing: -0.01em; }
    #ags-splash .sp-word span { font-weight: 300; color: var(--sp-muted); }
    #ags-splash .sp-progress { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    #ags-splash .sp-status { font-size: 14px; color: var(--sp-muted); min-height: 19px; }
    #ags-splash .sp-track { width: 300px; height: 4px; border-radius: 2px; background: var(--sp-track); overflow: hidden; }
    #ags-splash .sp-fill { position: relative; height: 4px; width: 8%; border-radius: 2px; background: var(--sp-glow); overflow: hidden; transition: width .5s ease; }
    #ags-splash .sp-fill i { position: absolute; top: 0; bottom: 0; width: 40%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .55), transparent); animation: sp-shine 1.4s linear infinite; }
    #ags-splash ol { list-style: none; margin: 0; padding: 0; width: 300px; display: flex; flex-direction: column; gap: 9px; font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, Consolas, monospace; font-size: 12px; }
    #ags-splash li { display: flex; align-items: center; gap: 10px; color: var(--sp-todo); }
    #ags-splash li::before { content: ''; flex-shrink: 0; width: 4px; height: 4px; margin: 0 5px; background: var(--sp-todo); }
    #ags-splash li[data-state="now"] { color: var(--sp-fg); }
    #ags-splash li[data-state="now"]::before { width: 9px; height: 9px; margin: 0 2.5px; box-sizing: border-box; background: none; border: 1.5px solid var(--sp-glow); border-right-color: transparent; border-radius: 50%; animation: sp-spin .9s linear infinite; }
    #ags-splash li[data-state="done"] { color: var(--sp-muted); }
    #ags-splash li[data-state="done"]::before { width: 5px; height: 9px; margin: -3px 4.5px 0; background: none; border: solid var(--sp-glow); border-width: 0 1.6px 1.6px 0; transform: rotate(45deg); }
    /* O robô: flutua, pisca, olha para os lados, bate os pés; no fim acena. */
    #ags-splash .sp-float { animation: sp-float 2.4s ease-in-out infinite; }
    #ags-splash .sp-shadow { transform-box: fill-box; transform-origin: center; animation: sp-shadow 2.4s ease-in-out infinite; }
    #ags-splash .sp-antenna { animation: sp-glow 1.2s steps(2, end) infinite; }
    #ags-splash .sp-look { animation: sp-look 3.2s steps(1, end) infinite; }
    #ags-splash .sp-eyes { transform-box: fill-box; transform-origin: center; animation: sp-blink 4s infinite; }
    #ags-splash .sp-leg { transform-box: fill-box; transform-origin: top; animation: sp-tap .5s steps(2, end) infinite; }
    #ags-splash .sp-leg.b { animation-delay: .25s; }
    #ags-splash .sp-arms { opacity: 0; }
    #ags-splash.is-done .sp-arms { opacity: 1; }
    #ags-splash.is-done .sp-wave-a { animation: sp-frame-a .6s infinite; }
    #ags-splash .sp-wave-b { opacity: 0; }
    #ags-splash.is-done .sp-wave-b { animation: sp-frame-b .6s infinite; }
    @keyframes sp-float { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-0.8px) } }
    @keyframes sp-shadow { 0%, 100% { transform: scaleX(1); opacity: 1 } 50% { transform: scaleX(.78); opacity: .55 } }
    @keyframes sp-glow { 0%, 100% { opacity: 1 } 50% { opacity: .3 } }
    @keyframes sp-blink { 0%, 92%, 100% { transform: scaleY(1) } 95% { transform: scaleY(.1) } }
    @keyframes sp-look { 0%, 20% { transform: translateX(0) } 30%, 45% { transform: translateX(-1px) } 55%, 70% { transform: translateX(1px) } 80%, 100% { transform: translateX(0) } }
    @keyframes sp-tap { 0%, 100% { transform: scaleY(1) } 50% { transform: scaleY(.55) } }
    @keyframes sp-frame-a { 0%, 49.9% { opacity: 1 } 50%, 100% { opacity: 0 } }
    @keyframes sp-frame-b { 0%, 49.9% { opacity: 0 } 50%, 100% { opacity: 1 } }
    @keyframes sp-halo { 0%, 100% { opacity: .55; transform: scale(1) } 50% { opacity: 1; transform: scale(1.08) } }
    @keyframes sp-spin { to { transform: rotate(360deg) } }
    @keyframes sp-shine { 0% { transform: translateX(-120%) } 100% { transform: translateX(320%) } }
    @media (prefers-reduced-motion: reduce) {
      #ags-splash *, #ags-splash *::before { animation: none !important; }
    }
  </style>
</head>

<body>
  <div id="ags-splash" role="status" aria-live="polite" data-tauri-drag-region>
    <div class="sp-stage" data-tauri-drag-region>
      <div class="sp-halo"></div>
      <svg class="sp-bot" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
        <ellipse class="sp-shadow" cx="8" cy="14.6" rx="3.6" ry="0.55" fill="var(--sp-shadow)" />
        <g class="sp-float">
          <g fill="#ff8a3d">
            <rect class="sp-leg" x="4" y="10.8" width="1" height="2.2" />
            <rect class="sp-leg b" x="6" y="10.8" width="1" height="2.2" />
            <rect class="sp-leg" x="9" y="10.8" width="1" height="2.2" />
            <rect class="sp-leg b" x="11" y="10.8" width="1" height="2.2" />
          </g>
          <g class="sp-arms">
            <rect x="1" y="8" width="1" height="1" fill="#ff8a3d" /><rect x="1" y="9" width="1" height="1" fill="#ffd24a" />
            <g class="sp-wave-a"><rect x="14" y="8" width="1" height="1" fill="#ff8a3d" /><rect x="14" y="9" width="1" height="1" fill="#ffd24a" /></g>
            <g class="sp-wave-b"><rect x="14" y="6" width="1" height="1" fill="#ff8a3d" /><rect x="15" y="5" width="1" height="1" fill="#ffd24a" /></g>
          </g>
          <rect class="sp-antenna" x="7" y="1" width="2" height="1" fill="var(--sp-glow)" />
          <g fill="var(--sp-body)">
            <rect x="7" y="2" width="2" height="1" /><rect x="3" y="3" width="10" height="1" /><rect x="2" y="4" width="12" height="1" />
            <rect x="2" y="5" width="12" height="4" /><rect x="1" y="6" width="14" height="2" /><rect x="2" y="9" width="12" height="1" />
          </g>
          <g fill="var(--sp-visor)"><rect x="4" y="5" width="8" height="1" /><rect x="3" y="6" width="10" height="2" /><rect x="4" y="8" width="8" height="1" /></g>
          <rect x="3" y="10" width="10" height="1" fill="var(--sp-shade)" />
          <g class="sp-look"><g class="sp-eyes" fill="var(--sp-glow)"><rect x="5" y="6" width="2" height="2" /><rect x="9" y="6" width="2" height="2" /></g></g>
        </g>
      </svg>
    </div>
    <div class="sp-word" data-tauri-drag-region><b>ADE</b><span>AGS</span></div>
    <div class="sp-progress">
      <div class="sp-status" id="ags-splash-status"></div>
      <div class="sp-track"><div class="sp-fill" id="ags-splash-fill"><i></i></div></div>
    </div>
    <ol id="ags-splash-steps">
      <li data-state="now"></li>
      <li data-state="todo"></li>
      <li data-state="todo"></li>
      <li data-state="todo"></li>
    </ol>
  </div>
  <script>
    // Os textos da tela de carregamento, antes de o i18n existir: o mesmo idioma que ele vai escolher
    // (`localStorage.language`, senão o do sistema). Depois a janela, que nasce escondida para não
    // piscar branca, pede para aparecer: o que ela mostra primeiro é esta tela.
    (function () {
      var lang = (localStorage.getItem('language') || navigator.language || 'en').toLowerCase();
      var texts = lang.indexOf('pt') === 0
        ? ['Abrindo a janela', 'Carregando os workspaces', 'Religando os terminais', 'Conectando os agentes', 'Tudo pronto']
        : lang.indexOf('es') === 0
          ? ['Abriendo la ventana', 'Cargando los workspaces', 'Reconectando las terminales', 'Conectando los agentes', 'Todo listo']
          : ['Opening the window', 'Loading workspaces', 'Reattaching terminals', 'Connecting agents', 'All set'];
      var splash = document.getElementById('ags-splash');
      var items = document.querySelectorAll('#ags-splash-steps li');
      for (var i = 0; i < items.length; i++) items[i].textContent = texts[i];
      splash.setAttribute('data-ready-text', texts[4]);
      document.getElementById('ags-splash-status').textContent = texts[0] + '…';
      try {
        var tauri = window.__TAURI_INTERNALS__;
        if (tauri) tauri.invoke('app_window_ready').catch(function () { });
      } catch (e) { }
      // Rede: se o app nunca disser que terminou, a tela não fica por cima dele para sempre.
      setTimeout(function () { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 20000);
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
