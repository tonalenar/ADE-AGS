<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADE AGS</title>
  <script>
    // Prevenir flash de contenido sin estilo (FOUC). Va inline y en <head> a propósito:
    // tiene que correr ANTES de que se pinte nada, así que no puede ser un módulo.
    // Resuelve Sistema antes del primer pintado para evitar que aparezca un frame con el tema anterior.
    const mode = localStorage.getItem('ade-appearance-mode');
    const legacy = localStorage.getItem('theme');
    const systemDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false;
    const theme = mode === 'system' ? (systemDark ? 'dark' : 'light')
      : mode === 'light' || mode === 'dark' ? mode
      : legacy === 'light' ? 'light' : 'dark';
    localStorage.setItem('theme', theme);
    document.documentElement.classList.toggle('dark', theme === 'dark');
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
