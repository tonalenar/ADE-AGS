<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>ShopMart — lupa</title>
<!-- L02: quatro ícones SEM NOME (menu, lupa, sino, coração). Só a foto diz qual é a lupa. -->
<link rel="stylesheet" href="common.css">
<header>
  <div class="icon" onclick="say('MENU OPEN')">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </div>
  <b>ShopMart</b>
  <span class="space"></span>
  <div class="icon" onclick="say('SEARCH OPEN')">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg>
  </div>
  <div class="icon" onclick="say('ALERTS OPEN')">
    <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>
  </div>
  <div class="icon" onclick="say('FAVORITES OPEN')">
    <svg viewBox="0 0 24 24"><path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z"/></svg>
  </div>
</header>
<main>
  <div id="status">Nothing opened yet.</div>
</main>
<script>function say(t) { document.getElementById('status').textContent = t; }</script>
</html>
