<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>ShopMart — busca</title>
<!-- L03: a busca só envia com Enter (um campo e nenhum botão: o envio implícito do formulário). -->
<link rel="stylesheet" href="common.css">
<header><b>ShopMart</b></header>
<main>
  <form method="get">
    <input type="search" name="q" placeholder="Buscar produtos" aria-label="Buscar produtos" size="40">
  </form>
  <div id="status"></div>
</main>
<script>
  const q = new URLSearchParams(location.search).get('q');
  if (q) document.getElementById('status').textContent = 'Resultados para: ' + q;
</script>
</html>
