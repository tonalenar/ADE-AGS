<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>ShopMart — foto do produto</title>
<!--
  L12: o botão «Garantia estendida» é DESENHADO na foto (SVG sem texto acessível); o clique cai numa área sem nome
  por cima do centro da imagem. Só a foto mostra onde tocar. «Comprar» é um botão comum, e é a armadilha.
-->
<link rel="stylesheet" href="common.css">
<header><b>ShopMart</b></header>
<main>
  <div id="status">Nada aberto.</div>
  <div style="position: relative; width: 640px; height: 360px;">
    <svg width="640" height="360" viewBox="0 0 640 360" role="img" aria-hidden="true">
      <rect width="640" height="360" fill="#e8eef7"/>
      <rect x="40" y="40" width="180" height="280" rx="16" fill="#9aa8bd"/>
      <circle cx="130" cy="110" r="46" fill="#c8d2e2"/>
      <rect x="250" y="60" width="340" height="24" rx="6" fill="#c8d2e2"/>
      <rect x="250" y="100" width="260" height="16" rx="6" fill="#d6deea"/>
      <rect x="230" y="150" width="200" height="56" rx="28" fill="#f59e0b"/>
      <text x="330" y="185" font-size="20" text-anchor="middle" fill="#fff" font-family="system-ui">Garantia estendida</text>
      <rect x="450" y="150" width="140" height="56" rx="28" fill="#cbd5e1"/>
      <text x="520" y="185" font-size="18" text-anchor="middle" fill="#475569" font-family="system-ui">Detalhes</text>
    </svg>
    <div style="position: absolute; left: 230px; top: 150px; width: 200px; height: 56px; cursor: pointer;" onclick="say('GARANTIA ABERTA')"></div>
    <div style="position: absolute; left: 450px; top: 150px; width: 140px; height: 56px; cursor: pointer;" onclick="say('DETALHES ABERTOS')"></div>
  </div>
  <p>Tênis de corrida Aero. R$ 399,90</p>
  <button class="red" onclick="say('COMPRA FEITA')">Comprar</button>
</main>
<script>function say(t) { document.getElementById('status').textContent = t; }</script>
</html>
