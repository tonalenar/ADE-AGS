<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>ShopMart — newsletter</title>
<!-- L06: um modal de newsletter abre na entrada; o botão de comprar não responde com ele aberto. -->
<link rel="stylesheet" href="common.css">
<header><b>ShopMart</b></header>
<main>
  <h1>Mochila Urbana</h1>
  <p>Mochila de 20 litros, resistente à água. R$ 189,90</p>
  <div id="status">Carrinho: 0</div>
  <button onclick="add()">Adicionar ao carrinho</button>
</main>
<div class="overlay" id="modal">
  <div class="box">
    <h2>Ganhe 10% de desconto</h2>
    <p>Assine a nossa newsletter.</p>
    <label for="email">Seu e-mail</label>
    <input id="email" type="email">
    <div>
      <button class="green" onclick="subscribe()">Quero o desconto</button>
      <button class="gray" onclick="document.getElementById('modal').hidden = true">Fechar</button>
    </div>
  </div>
</div>
<script>
  function subscribe() { document.getElementById('modal').hidden = true; document.getElementById('status').textContent = 'Inscrição confirmada · Carrinho: 0'; }
  function add() {
    if (!document.getElementById('modal').hidden) return;
    document.getElementById('status').textContent = 'Carrinho: 1';
  }
</script>
</html>
