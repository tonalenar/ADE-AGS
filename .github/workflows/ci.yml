# Chequeos de cada PR y de cada push a master: los mismos tests que corre el release,
# pero antes de mergear y no recién al sacar un tag.
#
# Dos jobs:
# - `test` (Linux): corre los tests de verdad (tsc, babel, vitest y `cargo test`).
# - `check-windows`: solo `cargo check`, que compila también el código con gate
#   `#[cfg(windows)]` y los tests (sin correrlos). No se corren los tests en Windows porque
#   suman unos 4 min al job y hoy fallan 2 tests solo en Windows, que dejarían el job rojo:
#   `ipc::test::un_symlink_que_apunta_a_otro_lado_no_cuenta_como_instalado` y
#   `missions::cleanup::tests::listing_and_prune_preserve_orphans_and_active_then_clean_closed`.
#   Los tests con gate `#[cfg(windows)]` se siguen corriendo a mano en Windows.

name: ci

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      # Las mismas que `release.yml`: el crate enlaza webkit2gtk aunque los tests no abran
      # ninguna ventana.
      - name: Dependencias de Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev libxdo-dev

      - name: Cache de cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ci-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ci-cargo-

      - run: bun install --frozen-lockfile

      - name: Tests del frontend
        run: |
          bunx tsc --noEmit
          node scripts/babel-parse-check.mjs src
          bun run test

      - name: Tests de Rust
        run: cd src-tauri && cargo test --lib --bin ags

  # Atrapa lo que solo rompe en Windows (código `#[cfg(windows)]`, imports que solo usa
  # Windows) y que el job de Linux no compila. Sin bun ni dependencias de sistema: en debug
  # Tauri usa `devUrl`, así que no hace falta el `dist` del frontend.
  check-windows:
    name: check (windows)
    runs-on: windows-latest
    # Un cargo check frío tarda ~4 min; si pasa de 30 el job está colgado, no lento.
    timeout-minutes: 30
    env:
      # El incremental no sirve en CI y engorda el `target/` que va al cache.
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Clave aparte de la de Linux (`ci-cargo-`): los artefactos no se comparten entre SOs.
      - name: Cache de cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ci-windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ci-windows-cargo-

      # `--bins` (no `--bin ags`) también compila `src/main.rs` (`windows_subsystem`) y `ccode`.
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --lib --bins --tests

      # TEMPORAL, solo para validar el fix del symlink. No mergear.
      - name: cargo test symlink (temporal)
        working-directory: src-tauri
        run: cargo test --lib --bin ags un_symlink_que_apunta_a_otro_lado
